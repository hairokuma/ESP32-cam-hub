<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-CAM Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="cameraGrid">
    {% for camera in cameras %}
    <article class="camera-card" data-camera-id="{{ camera.id }}">
      <header>
        <span class="status-dot" data-online="{{ 'true' if camera.online else 'false' }}"></span>
        <span>{{ camera.ip }}</span>
        <nav>
          <button onclick="toggleLED('{{camera.id}}', event)">LED</button>
          <button onclick="navigate('#calendar/{{camera.id}}')">&#9654;</button>
        </nav>
      </header>
      <div class="stream-wrap">
        <span class="stream-label">Wird geladen…</span>
        <img
          src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%221%22 height=%221%22%3E%3C/svg%3E"
          data-stream-url="{{camera.streamUrl}}"
          alt="Kamera {{ camera.id }}"
          class="camera-stream"
          onclick="navigate('#timeline/{{ camera.id }}')">
      </div>
      <footer>{{ camera.imageCount }} Aufnahmen &middot; {{ camera.latestTime }}</footer>
    </article>
    {% endfor %}
  </main>

  <dialog id="timelineDialog">
    <button class="btn-close" onclick="closeCurrentView()">&#10005;</button>
    <div id="timelineActive" class="stage">
      <button class="btn-nav btn-prev" id="prevImage">&#8249;</button>
      <button class="btn-nav btn-next" id="nextImage">&#8250;</button>
    </div>
    <div class="timeline-container">
      <div class="batch-container" id="batchContainer"></div>
      <div class="scrubber-track" id="scrubberTrack">
        <div class="scrubber-bar" id="scrubberBar">
          <div class="scrubber-tooltip" id="scrubberTooltip"></div>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </dialog>

  <dialog id="calendarDialog">
    <button class="btn-close" onclick="closeCurrentView()">&#10005;</button>
    <section class="calendar">
      <header>
        <button onclick="navigateMonth(-1)">&#8249;</button>
        <h2 class="current-month"></h2>
        <button onclick="navigateMonth(1)">&#8250;</button>
        <button onclick="goToToday()">Heute</button>
      </header>
      <div class="calendar-grid">
        <span class="day-name">Mo</span>
        <span class="day-name">Di</span>
        <span class="day-name">Mi</span>
        <span class="day-name">Do</span>
        <span class="day-name">Fr</span>
        <span class="day-name">Sa</span>
        <span class="day-name">So</span>
      </div>
    </section>
  </dialog>

  <dialog id="videoDialog">
    <button class="btn-close" onclick="closeCurrentView()">&#10005;</button>
    <button class="btn-nav btn-prev" id="prevVideo" onclick="navigateVideo(-1)">&#8249;</button>
    <button class="btn-nav btn-next" id="nextVideo" onclick="navigateVideo(1)">&#8250;</button>
    <video id="videoPlayer" controls></video>
    <footer>
      <span id="videoDate"></span>
      <span id="videoSize"></span>
    </footer>
  </dialog>

  <script src="/main.js"></script>
  <script src="/calendar.js"></script>
  <script src="/timeline.js"></script>
</body>
</html>
