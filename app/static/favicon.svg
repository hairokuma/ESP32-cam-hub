<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Black background -->
  <rect width="200" height="200" rx="50" ry="50" fill="#111111"/>

  <!-- Camera body -->
  <rect x="30" y="45" width="140" height="90" rx="12" ry="12" fill="none" stroke="white" stroke-width="8"/>

  <!-- Camera viewfinder bump -->
  <path d="M75 45 L75 32 Q75 26 81 26 L119 26 Q125 26 125 32 L125 45" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/>

  <!-- Camera lens outer ring -->
  <circle cx="100" cy="90" r="28" fill="none" stroke="white" stroke-width="7"/>

  <!-- Camera lens inner (orange) -->
  <circle cx="100" cy="90" r="16" fill="#E85C00"/>

  <!-- Flash / indicator dot top-right -->
  <circle cx="148" cy="58" r="5" fill="#E85C00"/>

  <!-- Timeline horizontal line -->
  <line x1="18" y1="162" x2="175" y2="162" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Timeline tick marks -->
  <line x1="50"  y1="153" x2="50"  y2="171" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="90"  y1="153" x2="90"  y2="171" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="153" x2="130" y2="171" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <circle cx="162" cy="162" r="5" fill="#E85C00" stroke="#111111" stroke-width="3"/>

  <!-- Orange cursor arrow at end of timeline -->
  <!-- <path d="M162,172 L146,183 L154,183 L149,191 L152,193 L157,184 L162,190 Z" fill="#E85C00"/> -->
</svg>
